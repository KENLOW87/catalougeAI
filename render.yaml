services:
  - type: web
    name: geometra-catalogue-backend
    runtime: docker
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    healthCheckPath: /api/ai/status
    plan: free
    # The free plan cannot attach a persistent disk, so there is no `disk:`
    # here — anything written under app/ lives on the container's writable
    # layer and is wiped every time the service redeploys OR spins down from 15
    # minutes of no traffic (free-plan behaviour).
    #
    # PUBLISHED CATALOGUES no longer care: with SUPABASE_URL and
    # SUPABASE_SERVICE_ROLE_KEY set below, they are stored in Supabase rather
    # than on this disk, so they survive both. That was the "catalogue keeps
    # disappearing from the live site" bug. Leave either variable unset and the
    # server silently falls back to on-disk files and the bug comes straight
    # back.
    #
    # Activity/usage logs (app/data/activity/) are still on the writable layer
    # and are still lost on redeploy and spin-down. Download anything worth
    # keeping before a redeploy.
    envVars:
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Durable storage for published catalogues. Set both in the Render
      # dashboard, never here: the service_role key bypasses row-level security
      # and is a server-only secret. Project Settings > Data API > Project URL,
      # and Project Settings > API Keys > service_role.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1.5
      - key: CATALOGUE_ENABLE_AI_FALLBACK
        value: "0"
      # Defaults OFF on purpose: "1" puts the catalogue assistant bot on the
      # public, no-login site itself — able to add/delete products and run AI
      # photo edits there, reachable by anyone with the URL, not only the
      # admin. Flip to "1" in the Render dashboard only as a separate,
      # deliberate step once you accept that risk.
      - key: PUBLIC_CATALOGUE_EDIT
        value: "0"
      - key: PUBLIC_BOT_RATE_LIMIT_PER_HOUR
        value: "20"
