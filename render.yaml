services:
  - type: web
    name: geometra-catalogue-backend
    runtime: docker
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    healthCheckPath: /api/ai/status
    plan: free
    # The free plan cannot attach a persistent disk, so there is no `disk:`
    # here — app/data/ (activity logs, published-catalogue snapshots) lives on
    # the container's writable layer and is wiped every time the service
    # redeploys OR spins down from 15 minutes of no traffic (free-plan
    # behaviour). A published catalogue only stays visible while the service
    # stays warm; re-publish after any sleep/redeploy, or keep it warm with an
    # external pinger (e.g. cron-job.org hitting /api/ai/status every 10 min).
    # Upgrading to a paid plan and adding a `disk:` block here removes this
    # limitation entirely.
    envVars:
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1.5
      - key: CATALOGUE_ENABLE_AI_FALLBACK
        value: "0"
      # Defaults OFF on purpose: "1" puts the catalogue assistant bot on the
      # public, no-login site itself — able to add/delete products and run AI
      # photo edits there, reachable by anyone with the URL, not only the
      # admin. Flip to "1" in the Render dashboard only as a separate,
      # deliberate step once you accept that risk.
      - key: PUBLIC_CATALOGUE_EDIT
        value: "0"
      - key: PUBLIC_BOT_RATE_LIMIT_PER_HOUR
        value: "20"
